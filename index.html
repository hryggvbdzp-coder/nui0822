<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; width: 90%; max-width: 500px; }
        h1 { color: #00ffcc; font-size: 2rem; margin-bottom: 20px; }
        .search { display: flex; border-radius: 25px; overflow: hidden; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        input { flex: 1; padding: 15px; border: none; outline: none; background: #222; color: #fff; font-size: 16px; }
        button { background: #00ffcc; color: #111; border: none; padding: 0 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cca3; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Web Proxy</h1>
        <div class="search">
            <!-- 変更点: CroxyProxyの制限を回避するためJavaScriptで直接URLを生成して飛ばす仕組みにしました -->
            <input type="text" id="urlInput" placeholder="URLを入力 (例: youtube.com)" required>
            <button onclick="launchProxy()">GO</button>
        </div>
    </div>

    <script>
        function launchProxy() {
            var url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            
            // http:// や https:// が付いていない場合は自動で補完する
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            
            // CroxyProxyが直接Webサイトを開くときの専用URLを生成
            var proxyUrl = "https://croxyproxy.com" + encodeURIComponent(url);
            
            // 新しいタブで開く
            window.open(proxyUrl, '_blank');
        }
        
        // エンターキーでも実行できるようにする
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                launchProxy();
            }
        });
    </script>
</body>
</html>
